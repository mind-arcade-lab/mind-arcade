<!doctype html>
<html lang="zh-CN" data-game-id="symbol-search">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f6f9" />
    <meta name="description" content="快速判断目标符号是否出现" />
    <title>符号搜索</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="/mind-arcade/assets/symbol-search-B8dVG6y5.js"></script>
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/records-DoshgVEY.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/dom-Dh2ICPvY.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/bootstrap-Cmf7mnoy.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/preload-helper-CNfLh5Zf.js">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/bootstrap-bbBnIK_c.css">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/preload-helper-BtxUFnaF.css">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/style-B7DyixNJ.css">
  </head>
  <body class="">
    <div class="page">
  <nav class="back-nav"><a class="back-link" href="../../">← <span data-core-text="overview">总览</span></a></nav>
<header class="site-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="11" height="11" rx="3" fill="#625a83"></rect>
      <rect x="19" y="2" width="11" height="11" rx="3" fill="#52775f"></rect>
      <rect x="2" y="19" width="11" height="11" rx="3" fill="#6586a0"></rect>
      <rect x="19" y="19" width="11" height="11" rx="3" fill="#ac8460"></rect>
    </svg>
    <h1 data-game-title="">符号搜索</h1>
  </div>
  <div class="language-switch" data-language-switch="">
    <select data-language-select="" aria-label="语言"></select>
  </div>
</header>

  <main>
    <section class="workspace" aria-label="练习区域" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.practice-area&quot;}">
      <div class="board-panel">
        <div class="board-top">
          <span id="phase-label" class="phase-label" role="status" data-i18n="ui.ready">准备开始</span><span id="attempt-count" class="attempt-count"></span>
        </div>
        <div class="task-stage">
          <div id="idle-panel" class="stage-view idle-view">
            <div id="idle-samples" class="idle-samples" aria-hidden="true"></div>
            <h2 id="idle-caption" data-i18n="ui.does-the-row-below-contain-either-target-symbol">下方是否包含上方任意一个目标符号？</h2>
          </div>
          <div id="countdown-panel" class="stage-view countdown-view" hidden="">
            <strong id="countdown-value" aria-live="assertive">3</strong>
          </div>
          <div id="play-panel" class="stage-view" tabindex="-1" aria-label="作答区域" hidden="" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.response-area&quot;}">
            <div id="search-task" class="search-task" hidden="">
              <div class="task-label" data-i18n="ui.targets">目标</div>
              <div id="target-row" class="symbol-row target-row"></div>
              <div class="task-label" data-i18n="ui.search-row">搜索区域</div>
              <div id="search-row" class="symbol-row search-row"></div>
              <div class="binary-options">
                <button type="button" data-answer="false">
                  <kbd>←</kbd><span data-i18n="ui.absent">没有</span></button><button type="button" data-answer="true">
                  <span data-i18n="ui.present">有</span><kbd>→</kbd>
                </button>
              </div>
            </div>
          </div>
          <div id="result-panel" class="stage-view result-view" hidden="">
            <h2 id="finish-title" data-i18n="ui.time-is-up">时间到</h2>
            <div class="result-score">
              <strong id="final-score">0</strong><span data-i18n="rules.correct-count">正确数</span>
            </div>
          </div>
        </div>
        <div class="board-bottom"><span id="board-hint"></span></div>
        <div id="progress" class="progress" role="progressbar" aria-label="计时进度" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.time-elapsed&quot;}">
          <span id="progress-fill"></span>
        </div>
      </div>
      <aside class="sidebar">
        <div class="timer-block">
          <div class="timer-heading">
            <span data-i18n="ui.time-remaining">剩余时间</span><span class="status-dot" aria-hidden="true"></span>
          </div>
          <div class="timer" id="timer-main" role="timer" aria-label="剩余时间" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.time-remaining&quot;}">
            00:30
          </div>
          <p id="result-note" class="result-note" aria-live="polite"></p>
          <button type="button" id="action" class="primary-button">
            <span id="action-label" data-i18n="ui.start">开始</span><svg id="action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M5 12h14m-6-6 6 6-6 6"></path>
            </svg>
          </button>
        </div>
        <p class="rule-note" data-i18n="rules.timed">30 秒 · 答错即结束 · 按答对数量计分</p>
      </aside>
    </section>
  </main>
  <p id="notice" class="notice" role="status" hidden=""></p>
  <noscript>请启用 JavaScript 后开始练习。 / Enable JavaScript to start practicing.</noscript>
</div>

  </body>
</html>
