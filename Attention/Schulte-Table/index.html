<!doctype html>
<html lang="zh-CN" data-game-id="schulte-table">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f6f9" />
    <meta name="description" content="按数字顺序，尽快点完方格" />
    <title>舒尔特方格</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="/mind-arcade/assets/schulte-table-EKiKvo4R.js"></script>
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/records-DoshgVEY.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/dom-Dh2ICPvY.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/bootstrap-Cmf7mnoy.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/preload-helper-CNfLh5Zf.js">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/bootstrap-bbBnIK_c.css">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/preload-helper-BtxUFnaF.css">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/schulte-table-CGWxNXu1.css">
  </head>
  <body class="">
    <div class="page">
  <nav class="back-nav"><a class="back-link" href="../../">← <span data-core-text="overview">总览</span></a></nav>
<header class="site-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="11" height="11" rx="3" fill="#625a83"></rect>
      <rect x="19" y="2" width="11" height="11" rx="3" fill="#52775f"></rect>
      <rect x="2" y="19" width="11" height="11" rx="3" fill="#6586a0"></rect>
      <rect x="19" y="19" width="11" height="11" rx="3" fill="#ac8460"></rect>
    </svg>
    <h1 data-game-title="">舒尔特方格</h1>
  </div>
  <div class="language-switch" data-language-switch="">
    <select data-language-select="" aria-label="语言"></select>
  </div>
</header>


  <main>
    <section class="workspace" aria-label="舒尔特方格练习" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.schulte-table-practice&quot;}">
      <div class="board-panel">
        <div class="board-top">
          <div class="next-wrap">
            <span id="next-label" data-i18n="ui.next">下一个</span><strong id="next-number" aria-live="polite">1</strong>
          </div>
          <span class="board-count" id="board-count">0 <span>/ 25</span></span>
        </div>
        <div id="board-frame" class="board-frame">
          <div class="board-wrap">
            <div id="board" class="board" aria-label="数字方格" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.number-grid&quot;}"></div>
            <div id="board-cover" class="board-cover">
              <div class="cover-content">
                <strong id="cover-title">1 <span>→</span> 25</strong>
              </div>
            </div>
          </div>
        </div>
        <div class="board-bottom">
          <span id="board-instruction" data-i18n="ui.click-from-lowest-to-highest">从小到大，依次点击</span>
          <span><span data-i18n="rules.correct-count">正确数</span> <b id="score-count">0</b></span>
        </div>
        <div id="progress" class="progress" role="progressbar" aria-label="完成进度" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.completion-progress&quot;}">
          <span id="progress-fill"></span>
        </div>
      </div>

      <aside class="sidebar">
        <div class="timer-block">
          <div class="timer-heading">
            <span id="timer-label" data-i18n="ui.time-remaining">剩余时间</span><span id="timer-status" class="status-dot" aria-hidden="true"></span>
          </div>
          <div class="timer" role="timer" aria-label="剩余时间" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.time-remaining&quot;}">
            <span id="timer-main">00:30</span><span class="centiseconds" id="timer-fraction">.00</span>
          </div>
          <p id="result-note" class="result-note" aria-live="polite"></p>
          <button type="button" id="action" class="primary-button">
            <span id="action-label" data-i18n="ui.start">开始</span><svg id="action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M5 12h14m-6-6 6 6-6 6"></path>
            </svg>
          </button>
        </div>

        <div class="display-scale-control">
          <label for="matrix-scale" data-i18n="ui.display-size">画面大小</label>
          <input type="range" id="matrix-scale" min="40" max="100" step="5" value="100" aria-controls="board" aria-valuetext="100%">
          <output id="matrix-scale-value" for="matrix-scale">100%</output>
        </div>
        <p class="rule-note" data-i18n="rules.schulte">30 秒内依次点击，错一次即结束；完成一页后继续下一页，按点对的总数计分。</p>
        <form id="settings" class="settings" aria-label="练习设置" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.settings&quot;}">
          <fieldset>
            <legend data-i18n="ui.grid-size">方格大小</legend>
            <div class="size-options">
              <label><input type="radio" name="size" value="5" checked=""><span>5×5</span></label>
              <label><input type="radio" name="size" value="6"><span>6×6</span></label>
              <label><input type="radio" name="size" value="7"><span>7×7</span></label>
              <label><input type="radio" name="size" value="8"><span>8×8</span></label>
              <label><input type="radio" name="size" value="9"><span>9×9</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="ui.click-order">点击顺序</legend>
            <div class="segmented">
              <label><input type="radio" name="direction" value="asc" checked=""><span data-i18n="ui.ascending">从小到大</span></label>
              <label><input type="radio" name="direction" value="desc"><span data-i18n="ui.descending">从大到小</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="ui.after-a-correct-click">点对之后</legend>
            <div class="segmented">
              <label><input type="radio" name="disappear" value="false" checked=""><span data-i18n="ui.keep-numbers">保留数字</span></label>
              <label><input type="radio" name="disappear" value="true"><span data-i18n="ui.hide-numbers">消去数字</span></label>
            </div>
          </fieldset>
        </form>
      </aside>
    </section>
  </main>

  <p id="notice" class="notice" role="status" hidden=""></p>
  <noscript>请启用 JavaScript 后开始练习。 / Enable JavaScript to start practicing.</noscript>
</div>

  </body>
</html>
