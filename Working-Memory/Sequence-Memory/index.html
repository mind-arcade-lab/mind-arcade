<!doctype html>
<html lang="zh-CN" data-game-id="sequence-memory">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f6f9" />
    <meta name="description" content="记住亮格，按顺序复现" />
    <title>序列记忆</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="/mind-arcade/assets/sequence-memory-E1KlCWOE.js"></script>
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/records-DoshgVEY.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/dom-Dh2ICPvY.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/bootstrap-Cmf7mnoy.js">
    <link rel="modulepreload" crossorigin href="/mind-arcade/assets/preload-helper-CNfLh5Zf.js">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/bootstrap-bbBnIK_c.css">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/preload-helper-BtxUFnaF.css">
    <link rel="stylesheet" crossorigin href="/mind-arcade/assets/sequence-memory-CZkSuvC-.css">
  </head>
  <body class="">
    <div class="page">
  <nav class="back-nav"><a class="back-link" href="../../">← <span data-core-text="overview">总览</span></a></nav>
<header class="site-header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="11" height="11" rx="3" fill="#625a83"></rect>
      <rect x="19" y="2" width="11" height="11" rx="3" fill="#52775f"></rect>
      <rect x="2" y="19" width="11" height="11" rx="3" fill="#6586a0"></rect>
      <rect x="19" y="19" width="11" height="11" rx="3" fill="#ac8460"></rect>
    </svg>
    <h1 data-game-title="">序列记忆</h1>
  </div>
  <div class="language-switch" data-language-switch="">
    <select data-language-select="" aria-label="语言"></select>
  </div>
</header>


  <main>
    <section class="workspace" aria-label="序列记忆练习" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.sequence-memory-practice&quot;}">
      <div class="board-panel">
        <div class="board-top">
          <span id="phase-label" class="phase-label" role="status" data-i18n="ui.ready">准备开始</span>
          <span class="round-label"><span data-i18n="ui.length">长度</span> <strong id="round-length">1</strong></span>
        </div>
        <div id="board-frame" class="board-frame">
          <div class="board-wrap">
            <div id="board" class="board" aria-label="记忆方格" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.memory-grid&quot;}"></div>
            <div id="board-cover" class="board-cover">
              <div class="cover-content">
                <svg id="cover-icon" viewBox="0 0 60 40" fill="none" aria-hidden="true">
                  <rect x="1" y="11" width="18" height="18" rx="4" fill="currentColor" opacity=".2"></rect>
                  <rect x="21" y="1" width="18" height="18" rx="4" fill="currentColor"></rect>
                  <rect x="41" y="21" width="18" height="18" rx="4" fill="currentColor" opacity=".45"></rect>
                </svg>
                <strong id="cover-title" data-i18n="ui.remember-the-sequence">记住亮起的顺序</strong>
                <p id="cover-caption" data-i18n="ui.after-the-flashes-repeat-the-sequence">播放结束后，依次点击复现</p>
              </div>
            </div>
          </div>
        </div>
        <div class="board-bottom">
          <span id="board-hint" data-i18n="ui.a-square-may-flash-more-than-once">同一方格可能重复亮起</span><span id="response-count">0 / 1</span>
        </div>
        <div id="progress" class="progress" role="progressbar" aria-label="本轮复现进度" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.recall-progress-for-this-round&quot;}">
          <span id="progress-fill"></span>
        </div>
      </div>

      <aside class="sidebar">
        <div class="score-block">
          <div id="score-label" class="score-label" data-i18n="ui.longest-sequence">最长复现</div>
          <div class="score">
            <strong id="score-value">0</strong><span data-i18n="ui.steps">格</span>
          </div>
          <p id="result-note" class="result-note" aria-live="polite"></p>
          <button type="button" id="action" class="primary-button">
            <span id="action-label" data-i18n="ui.start">开始</span><svg id="action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M5 12h14m-6-6 6 6-6 6"></path>
            </svg>
          </button>
        </div>

        <div class="display-scale-control">
          <label for="matrix-scale" data-i18n="ui.display-size">画面大小</label>
          <input type="range" id="matrix-scale" min="40" max="100" step="5" value="100" aria-controls="board" aria-valuetext="100%">
          <output id="matrix-scale-value" for="matrix-scale">100%</output>
        </div>
        <form id="settings" class="settings" aria-label="练习设置" data-i18n-attrs="{&quot;aria-label&quot;:&quot;ui.settings&quot;}">
          <fieldset>
            <legend data-i18n="ui.grid-size">方格大小</legend>
            <div class="size-options">
              <label><input type="radio" name="size" value="3" checked=""><span>3×3</span></label>
              <label><input type="radio" name="size" value="4"><span>4×4</span></label>
              <label><input type="radio" name="size" value="5"><span>5×5</span></label>
              <label><input type="radio" name="size" value="6"><span>6×6</span></label>
              <label><input type="radio" name="size" value="7"><span>7×7</span></label>
            </div>
          </fieldset>
          <fieldset>
            <legend data-i18n="ui.sequence-rule">序列规则</legend>
            <div class="segmented">
              <label><input type="radio" name="mode" value="prefix" checked="" aria-describedby="rule-description"><span data-i18n="ui.extending">前缀版</span></label>
              <label><input type="radio" name="mode" value="random" aria-describedby="rule-description"><span data-i18n="ui.random">随机版</span></label>
            </div>
            <p id="rule-description" class="rule-description" data-i18n="ui.add-one-step-to-the-previous-sequence">原序列追加一格</p>
          </fieldset>
          <fieldset>
            <legend data-i18n="ui.recall-order">复现顺序</legend>
            <div class="segmented">
              <label><input type="radio" name="order" value="forward" checked=""><span data-i18n="ui.forward">正序</span></label>
              <label><input type="radio" name="order" value="reverse"><span data-i18n="ui.reverse">倒序</span></label>
            </div>
          </fieldset>
        </form>
      </aside>
    </section>
  </main>
  <p id="notice" class="notice" role="status" hidden=""></p>
  <noscript>请启用 JavaScript 后开始练习。 / Enable JavaScript to start practicing.</noscript>
</div>

  </body>
</html>
